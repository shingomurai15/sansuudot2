<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>さんすうドットつなぎ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    .board-line {
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }

    /* 消しゴムモード時の線分ハイライト */
    .eraser-mode .line-hitbox:hover + .board-line,
    .eraser-mode .board-line.highlighted {
      stroke: #ef4444 !important;
      stroke-width: 8px !important;
      filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.6));
    }

    .eraser-mode .line-hitbox {
      cursor: pointer;
    }

    .pen-mode .dot-node {
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-amber-50 h-screen h-[100dvh] flex flex-col text-slate-800 antialiased overflow-hidden">

  <!-- ヘッダーツールバー -->
  <header class="bg-white border-b-4 border-amber-300 px-3 py-2 shadow-sm flex items-center justify-between gap-2 shrink-0 flex-wrap sm:flex-nowrap">
    <div class="flex items-center gap-2">
      <div class="bg-amber-400 text-white p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-shapes text-xl"></i>
      </div>
      <h1 class="text-lg md:text-xl font-extrabold text-amber-900">さんすう ドットつなぎ</h1>
    </div>

    <!-- モード切り替え（ペン / 消しゴム） -->
    <div class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200 gap-1">
      <button id="mode-pen" class="px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all shadow-md bg-amber-500 text-white border-2 border-amber-600">
        <i class="fa-solid fa-pen-nib"></i>
        <span>ペン</span>
      </button>
      <button id="mode-eraser" class="px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-slate-200">
        <i class="fa-solid fa-eraser"></i>
        <span>けしごむ</span>
      </button>
    </div>

    <!-- 格子数変更（たて・よこ） -->
    <div class="flex items-center gap-2 bg-slate-50 px-2.5 py-1.5 rounded-2xl border border-slate-200 text-xs md:text-sm">
      <div class="flex items-center gap-1">
        <span class="font-bold text-slate-600">たて:</span>
        <button id="btn-row-down" class="w-6 h-6 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg flex items-center justify-center font-bold transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <span id="label-row-val" class="font-extrabold text-slate-800 w-4 text-center">8</span>
        <button id="btn-row-up" class="w-6 h-6 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg flex items-center justify-center font-bold transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-chevron-up text-xs"></i>
        </button>
      </div>

      <div class="w-[1px] h-4 bg-slate-200"></div>

      <div class="flex items-center gap-1">
        <span class="font-bold text-slate-600">よこ:</span>
        <button id="btn-col-down" class="w-6 h-6 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg flex items-center justify-center font-bold transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <span id="label-col-val" class="font-extrabold text-slate-800 w-4 text-center">10</span>
        <button id="btn-col-up" class="w-6 h-6 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg flex items-center justify-center font-bold transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-chevron-up text-xs"></i>
        </button>
      </div>
    </div>

    <!-- 操作ボタン（もどす / リセット） -->
    <div class="flex items-center gap-1.5">
      <button id="undo-btn" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition flex items-center gap-1 text-xs md:text-sm border border-slate-200 shadow-sm">
        <i class="fa-solid fa-rotate-left"></i>
        <span>もどす</span>
      </button>
      <button id="clear-all-btn" class="px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl transition flex items-center gap-1 text-xs md:text-sm shadow-sm">
        <i class="fa-solid fa-trash-can"></i>
        <span>けす</span>
      </button>
    </div>
  </header>

  <!-- ガイダンスメッセージ -->
  <div id="instruction-bar" class="bg-sky-100 border-b-2 border-sky-300 text-sky-900 py-1.5 px-4 font-bold text-center text-xs md:text-sm flex items-center justify-center gap-2 shrink-0">
    <i class="fa-solid fa-circle-info text-sky-600"></i>
    <span id="instruction-text">ドットを１つ えらんでね！</span>
  </div>

  <!-- キャンバス領域（最大化表示） -->
  <main id="geoboard-svg-container" class="flex-1 bg-white rounded-2xl shadow-md border-2 border-amber-200 relative overflow-hidden m-2 p-2 flex items-center justify-center min-h-0">
    
    <!-- 方眼ドット模様背景 -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#0284c7 1px, transparent 1px); background-size: 24px 24px;"></div>

    <!-- SVG 描画エリア -->
    <svg id="geoboard-svg" class="w-full h-full pen-mode" viewBox="0 0 800 600">
      <g id="grid-lines-layer" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 4"></g>
      <g id="lines-layer"></g>
      <g id="dots-layer"></g>
    </svg>
  </main>

  <script>
    const state = {
      gridRows: 8,
      gridCols: 10,
      mode: 'pen',
      selectedDot: null,
      lines: [],
      gridSpacing: 0,
      startX: 0,
      startY: 0,
      svgWidth: 800,
      svgHeight: 600
    };

    const svg = document.getElementById('geoboard-svg');
    const svgContainer = document.getElementById('geoboard-svg-container');
    const gridLinesLayer = document.getElementById('grid-lines-layer');
    const linesLayer = document.getElementById('lines-layer');
    const dotsLayer = document.getElementById('dots-layer');

    const modePenBtn = document.getElementById('mode-pen');
    const modeEraserBtn = document.getElementById('mode-eraser');

    const btnRowDown = document.getElementById('btn-row-down');
    const btnRowUp = document.getElementById('btn-row-up');
    const labelRowVal = document.getElementById('label-row-val');
    const btnColDown = document.getElementById('btn-col-down');
    const btnColUp = document.getElementById('btn-col-up');
    const labelColVal = document.getElementById('label-col-val');

    const undoBtn = document.getElementById('undo-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const instructionText = document.getElementById('instruction-text');
    const instructionBar = document.getElementById('instruction-bar');

    function getDotCoords(dotId) {
      const parts = dotId.split('-');
      const r = parseInt(parts[1], 10);
      const c = parseInt(parts[2], 10);
      return {
        x: state.startX + c * state.gridSpacing,
        y: state.startY + r * state.gridSpacing,
        r, c
      };
    }

    function renderGrid() {
      dotsLayer.innerHTML = '';
      gridLinesLayer.innerHTML = '';
      linesLayer.innerHTML = '';

      const rect = svgContainer.getBoundingClientRect();
      const svgWidth = Math.max(300, rect.width - 16 || 800);
      const svgHeight = Math.max(300, rect.height - 16 || 600);

      svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
      state.svgWidth = svgWidth;
      state.svgHeight = svgHeight;

      const rows = state.gridRows;
      const cols = state.gridCols;

      const padding = Math.max(20, Math.min(svgWidth, svgHeight) * 0.05);
      const availableWidth = svgWidth - padding * 2;
      const availableHeight = svgHeight - padding * 2;

      const stepX = availableWidth / Math.max(1, cols - 1);
      const stepY = availableHeight / Math.max(1, rows - 1);

      // 完全な正方形格子（最大化スケール）
      const spacing = Math.min(stepX, stepY);
      state.gridSpacing = spacing;

      const gridWidth = (cols - 1) * spacing;
      const gridHeight = (rows - 1) * spacing;

      const startX = (svgWidth - gridWidth) / 2;
      const startY = (svgHeight - gridHeight) / 2;

      state.startX = startX;
      state.startY = startY;

      // 1. 薄い格子線の描画
      for (let c = 0; c < cols; c++) {
        const x = startX + c * spacing;
        const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vLine.setAttribute('x1', x);
        vLine.setAttribute('y1', startY);
        vLine.setAttribute('x2', x);
        vLine.setAttribute('y2', startY + gridHeight);
        gridLinesLayer.appendChild(vLine);
      }

      for (let r = 0; r < rows; r++) {
        const y = startY + r * spacing;
        const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hLine.setAttribute('x1', startX);
        hLine.setAttribute('y1', y);
        hLine.setAttribute('x2', startX + gridWidth);
        hLine.setAttribute('y2', y);
        gridLinesLayer.appendChild(hLine);
      }

      // 2. ドット（水色）の描画（小さめのすっきりした面積サイズ）
      const dotRadius = Math.max(3.5, Math.min(5.5, spacing * 0.1));

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = startX + c * spacing;
          const cy = startY + r * spacing;
          const dotId = `dot-${r}-${c}`;

          // 指で押しやすい広いヒットエリア（透明）
          const hitCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          hitCircle.setAttribute('cx', cx);
          hitCircle.setAttribute('cy', cy);
          hitCircle.setAttribute('r', Math.max(18, spacing * 0.38));
          hitCircle.setAttribute('fill', 'transparent');
          hitCircle.setAttribute('class', 'cursor-pointer');
          hitCircle.dataset.id = dotId;

          // ドット本体（水色）
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', cx);
          circle.setAttribute('cy', cy);
          circle.setAttribute('r', dotRadius);
          circle.setAttribute('fill', '#38bdf8');
          circle.setAttribute('stroke', '#0284c7');
          circle.setAttribute('stroke-width', '1.5');
          circle.setAttribute('id', dotId);
          circle.setAttribute('class', 'dot-node pointer-events-none');

          hitCircle.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleDotClick(dotId, cx, cy);
          });

          dotsLayer.appendChild(hitCircle);
          dotsLayer.appendChild(circle);
        }
      }

      renderLines();
    }

    function renderLines() {
      linesLayer.innerHTML = '';

      state.lines.forEach(line => {
        const p1 = getDotCoords(line.startDotId);
        const p2 = getDotCoords(line.endDotId);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('data-line-id', line.id);

        // タッチ用太め判定線
        const hitbox = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hitbox.setAttribute('x1', p1.x);
        hitbox.setAttribute('y1', p1.y);
        hitbox.setAttribute('x2', p2.x);
        hitbox.setAttribute('y2', p2.y);
        hitbox.setAttribute('stroke', 'transparent');
        hitbox.setAttribute('stroke-width', '24');
        hitbox.setAttribute('stroke-linecap', 'round');
        hitbox.setAttribute('class', 'line-hitbox');

        // 表示される黒色の線分
        const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        lineEl.setAttribute('x1', p1.x);
        lineEl.setAttribute('y1', p1.y);
        lineEl.setAttribute('x2', p2.x);
        lineEl.setAttribute('y2', p2.y);
        lineEl.setAttribute('stroke', '#1e293b');
        lineEl.setAttribute('stroke-width', '4.5');
        lineEl.setAttribute('stroke-linecap', 'round');
        lineEl.setAttribute('class', 'board-line pointer-events-none');

        hitbox.addEventListener('pointerenter', () => {
          if (state.mode === 'eraser') lineEl.classList.add('highlighted');
        });

        hitbox.addEventListener('pointerleave', () => {
          lineEl.classList.remove('highlighted');
        });

        hitbox.addEventListener('pointerdown', (e) => {
          if (state.mode === 'eraser') {
            e.preventDefault();
            e.stopPropagation();
            deleteLine(line.id);
          }
        });

        g.appendChild(hitbox);
        g.appendChild(lineEl);
        linesLayer.appendChild(g);
      });
    }

    function handleDotClick(dotId, cx, cy) {
      if (state.mode !== 'pen') return;

      const dotElement = document.getElementById(dotId);

      if (!state.selectedDot) {
        // 1つ目のドットを選択（赤色に変色・動きなし）
        state.selectedDot = { id: dotId, x: cx, y: cy };
        dotElement.setAttribute('fill', '#ef4444');
        dotElement.setAttribute('stroke', '#991b1b');
        updateInstruction();
      } else if (state.selectedDot.id === dotId) {
        // 同じドットの選択解除
        resetSelectedDot();
        updateInstruction();
      } else {
        // 2つ目のドットを選択（線分描画＆初期化）
        const startDot = state.selectedDot;
        const endDot = { id: dotId, x: cx, y: cy };

        const isDuplicate = state.lines.some(l => 
          (l.startDotId === startDot.id && l.endDotId === endDot.id) ||
          (l.startDotId === endDot.id && l.endDotId === startDot.id)
        );

        if (!isDuplicate) {
          state.lines.push({
            id: `line-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
            startDotId: startDot.id,
            endDotId: endDot.id
          });
          renderLines();
        }

        resetSelectedDot();
        updateInstruction();
      }
    }

    function resetSelectedDot() {
      if (state.selectedDot) {
        const prevDot = document.getElementById(state.selectedDot.id);
        if (prevDot) {
          prevDot.setAttribute('fill', '#38bdf8');
          prevDot.setAttribute('stroke', '#0284c7');
        }
        state.selectedDot = null;
      }
    }

    function deleteLine(lineId) {
      state.lines = state.lines.filter(l => l.id !== lineId);
      renderLines();
    }

    function setMode(newMode) {
      state.mode = newMode;
      resetSelectedDot();

      if (newMode === 'pen') {
        modePenBtn.className = "px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all shadow-md bg-amber-500 text-white border-2 border-amber-600";
        modeEraserBtn.className = "px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-slate-200";
        svg.classList.remove('eraser-mode');
        svg.classList.add('pen-mode');
      } else {
        modeEraserBtn.className = "px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all shadow-md bg-rose-500 text-white border-2 border-rose-600";
        modePenBtn.className = "px-3 py-2 rounded-xl font-extrabold text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-slate-200";
        svg.classList.remove('pen-mode');
        svg.classList.add('eraser-mode');
      }
      updateInstruction();
    }

    function updateInstruction() {
      if (state.mode === 'eraser') {
        instructionText.textContent = "けしたい せんを タップしてね！";
        instructionBar.className = "bg-rose-100 border-b-2 border-rose-300 text-rose-900 py-1.5 px-4 font-bold text-center text-xs md:text-sm flex items-center justify-center gap-2 shrink-0";
      } else {
        instructionBar.className = "bg-sky-100 border-b-2 border-sky-300 text-sky-900 py-1.5 px-4 font-bold text-center text-xs md:text-sm flex items-center justify-center gap-2 shrink-0";
        if (state.selectedDot) {
          instructionText.textContent = "２つめの ドットを えらぶと せんが ひけるよ！";
        } else {
          instructionText.textContent = "ドットを１つ えらんでね！";
        }
      }
    }

    // イベントリスナー
    modePenBtn.addEventListener('click', () => setMode('pen'));
    modeEraserBtn.addEventListener('click', () => setMode('eraser'));

    const MIN_GRID = 3;
    const MAX_GRID = 15;

    function updateGridControls() {
      labelRowVal.textContent = state.gridRows;
      labelColVal.textContent = state.gridCols;
    }

    btnRowDown.addEventListener('click', () => {
      if (state.gridRows > MIN_GRID) {
        state.gridRows--;
        updateGridControls();
        resetSelectedDot();
        renderGrid();
      }
    });

    btnRowUp.addEventListener('click', () => {
      if (state.gridRows < MAX_GRID) {
        state.gridRows++;
        updateGridControls();
        resetSelectedDot();
        renderGrid();
      }
    });

    btnColDown.addEventListener('click', () => {
      if (state.gridCols > MIN_GRID) {
        state.gridCols--;
        updateGridControls();
        resetSelectedDot();
        renderGrid();
      }
    });

    btnColUp.addEventListener('click', () => {
      if (state.gridCols < MAX_GRID) {
        state.gridCols++;
        updateGridControls();
        resetSelectedDot();
        renderGrid();
      }
    });

    undoBtn.addEventListener('click', () => {
      if (state.lines.length > 0) {
        state.lines.pop();
        renderLines();
      }
    });

    clearAllBtn.addEventListener('click', () => {
      if (state.lines.length === 0) return;
      state.lines = [];
      resetSelectedDot();
      renderLines();
      updateInstruction();
    });

    // スワイプ消しゴム対応
    let isTouching = false;
    svg.addEventListener('pointerdown', () => { isTouching = true; });
    window.addEventListener('pointerup', () => { isTouching = false; });

    svg.addEventListener('pointermove', (e) => {
      if (state.mode === 'eraser' && isTouching) {
        const rect = svg.getBoundingClientRect();
        const scaleX = state.svgWidth / rect.width;
        const scaleY = state.svgHeight / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        
        state.lines.forEach(line => {
          const p1 = getDotCoords(line.startDotId);
          const p2 = getDotCoords(line.endDotId);
          if (distToSegment({ x, y }, p1, p2) < 18) {
            deleteLine(line.id);
          }
        });
      }
    });

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    const resizeObserver = new ResizeObserver(() => {
      renderGrid();
    });
    resizeObserver.observe(svgContainer);

    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      updateInstruction();
    });
  </script>
</body>
</html>
